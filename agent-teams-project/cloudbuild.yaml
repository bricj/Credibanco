steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agent-teams:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agent-teams:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'agent-teams'
    - '--image'
    - 'gcr.io/$PROJECT_ID/agent-teams:latest'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--memory'
    - '2Gi'
    - '--cpu'
    - '2'
    - '--timeout'
    - '300'
    - '--max-instances'
    - '3'
    - '--set-env-vars'
    - 'GCP_PROJECT_ID=${_GCP_PROJECT_ID},GCP_REGION=${_GCP_REGION},LLM_MODEL=${_LLM_MODEL},GOOGLE_API_KEY=${_GOOGLE_API_KEY},DATABASE_URL=${_DATABASE_URL},TELEGRAM_BOT_TOKEN=${_TELEGRAM_BOT_TOKEN}'

images:
- 'gcr.io/$PROJECT_ID/agent-teams:latest'

# Valores por defecto (se pueden sobrescribir desde línea de comando)
substitutions:
  _GCP_PROJECT_ID: 'credibancoagent'
  _GCP_REGION: 'us-central1'
  _LLM_MODEL: 'gemini-1.5-flash'
  _DATABASE_URL: 'sqlite:///./data/company_data.db'
  _GOOGLE_API_KEY: ''
  _TELEGRAM_BOT_TOKEN: ''